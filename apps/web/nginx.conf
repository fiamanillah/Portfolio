server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Performance: Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health Check endpoint for Dokploy / Docker healthcheck
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Static Assets with Cache Busting (1 year immutable cache)
    location ~* ^/(?:_astro|assets|fonts)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images, Favicons, Media
    location ~* \.(?:ico|svg|png|jpe?g|webp|avif|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML / Sitemaps / Feeds - Always revalidate
    location ~* \.(?:html|xml|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Main Routing: Clean URLs & Astro Fallbacks
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Custom 404 Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
