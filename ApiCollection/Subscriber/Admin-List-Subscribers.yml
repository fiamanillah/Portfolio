info:
  name: Admin - List Subscribers
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/subscriber/v1/list?page=1&limit=20&status=subscribed"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
