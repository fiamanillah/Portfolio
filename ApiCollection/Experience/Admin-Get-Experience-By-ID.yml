info:
  name: Admin - Get Experience By ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/experiences/v1/admin/{{experienceId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
