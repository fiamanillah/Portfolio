info:
  name: Admin - Update Experience
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/experiences/v1/admin/{{experienceId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "role": "Staff Software Engineer",
        "achievements": [
          "Spearheaded monorepo refactoring and unified internal design system."
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
