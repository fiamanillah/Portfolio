info:
  name: Bulk Delete Media Files
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/media/v1/files/bulk-delete"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "ids": [
          "{{mediaId1}}",
          "{{mediaId2}}"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
