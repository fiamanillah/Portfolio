info:
  name: Clean Orphaned & Unreferenced Media
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/media/v1/cleanup"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "olderThanDays": 0,
        "type": "all",
        "dryRun": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
