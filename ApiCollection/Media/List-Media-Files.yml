info:
  name: List Media Files
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/media/v1/files?page=1&limit=20&folder=blogs&sortBy=createdAt&sortOrder=desc"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
