info:
  name: Generate Presigned Upload URL
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/media/v1/presigned-url"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "fileName": "large-video-demo.mp4",
        "mimeType": "video/mp4",
        "size": 15728640,
        "folder": "blogs",
        "source": "BLOG_EDITOR",
        "tags": ["video", "demo"],
        "altText": "Interactive product demo video",
        "isPublic": true,
        "expiresInSeconds": 900
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
