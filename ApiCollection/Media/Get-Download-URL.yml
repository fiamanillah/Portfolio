info:
  name: Get Download URL
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/media/v1/download/{{mediaId}}?expiresIn=1800"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
