info:
  name: Admin - Update Comment Status
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/comments/v1/admin/comments/{{commentId}}/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "status": "APPROVED",
        "isPinned": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
