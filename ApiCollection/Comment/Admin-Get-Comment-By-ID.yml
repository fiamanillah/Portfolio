info:
  name: Admin - Get Comment By ID
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/comments/v1/admin/comments/{{commentId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
