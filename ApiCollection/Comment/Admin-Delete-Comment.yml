info:
  name: Admin - Delete Comment
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/comments/v1/admin/comments/{{commentId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
