info:
  name: Public - Delete Own Comment
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/comments/v1/public/{{commentId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
