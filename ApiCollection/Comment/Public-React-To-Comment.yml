info:
  name: Public - React To Comment
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/comments/v1/public/{{commentId}}/react"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "reactionType": "like"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
