info:
  name: Admin - List Redirects
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/redirects/v1/admin?page=1&limit=20&sortBy=createdAt&sortOrder=desc"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
