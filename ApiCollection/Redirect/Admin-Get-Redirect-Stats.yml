info:
  name: Admin - Get Redirect Stats
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/redirects/v1/admin/stats"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
