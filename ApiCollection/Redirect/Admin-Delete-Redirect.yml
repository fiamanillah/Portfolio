info:
  name: Admin - Delete Redirect Rule
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/redirects/v1/admin/{{redirectId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
