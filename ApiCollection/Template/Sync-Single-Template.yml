info:
  name: Sync Single Template
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/templates/v1/TEMPLATE_ID/sync"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
