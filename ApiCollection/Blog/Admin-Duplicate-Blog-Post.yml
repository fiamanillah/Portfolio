info:
  name: Admin - Duplicate Blog Post
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/blogs/v1/admin/posts/{{postId}}/duplicate"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
