info:
  name: Admin - Get Blog Post By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/blogs/v1/admin/posts/{{postId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
