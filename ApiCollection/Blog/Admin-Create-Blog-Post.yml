        "content": "## Introduction to High-Availability Bun Clusters\n\nWhen deploying microservices in high-concurrency environments, zero-downtime rolling updates require coordinating Kubernetes readiness probes with graceful socket termination.\n\n### Graceful Termination\n\n```typescript\nprocess.on('SIGTERM', async () => {\n  console.log('Shutting down gracefully...');\n  server.stop();\n  await prisma.$disconnect();\n  process.exit(0);\n});\n```\n\n## Conclusion\n\nCombining graceful drain timeouts with Kubernetes pod disruption budgets provides 99.999% availability.",
