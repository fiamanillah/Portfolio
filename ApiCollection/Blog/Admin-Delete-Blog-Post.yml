info:
  name: Admin - Delete Blog Post
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/blogs/v1/admin/posts/{{postId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
