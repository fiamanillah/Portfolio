info:
  name: Admin - Set Resume Version Active
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/resume/v1/admin/{{resumeId}}/activate"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
