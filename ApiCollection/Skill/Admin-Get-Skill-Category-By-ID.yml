info:
  name: Admin - Get Skill Category By ID
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/skills/v1/admin/categories/{{categoryId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
