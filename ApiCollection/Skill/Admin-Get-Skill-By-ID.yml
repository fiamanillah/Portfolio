http:
  method: GET
  url: "{{baseUrl}}/skills/v1/admin/{{skillId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
