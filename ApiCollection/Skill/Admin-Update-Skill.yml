info:
  name: Admin - Update Skill
  type: http
  seq: 16

http:
  method: PATCH
  url: "{{baseUrl}}/skills/v1/admin/{{skillId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "proficiency": 98,
        "isTopSkill": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
