info:
  name: Admin - Broadcast Newsletter Immediately
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/newsletter/v1/{{campaignId}}/send"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
