info:
  name: Admin - Schedule Newsletter Broadcast
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/newsletter/v1/{{campaignId}}/schedule"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "scheduledAt": "2026-09-01T14:00:00.000Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
