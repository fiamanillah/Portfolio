info:
  name: Admin - Get Campaign Delivery Logs
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/newsletter/v1/{{campaignId}}/logs?page=1&limit=50&status=DELIVERED"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
