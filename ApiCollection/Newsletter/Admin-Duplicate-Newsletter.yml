info:
  name: Admin - Duplicate Newsletter Campaign
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/newsletter/v1/{{campaignId}}/duplicate"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
