info:
  name: Admin - Update Newsletter Campaign
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/newsletter/v1/{{campaignId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "subject": "Deep Dive: Distributed Rate Limiting (Updated)",
        "previewText": "Updated preview text with performance metrics."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
