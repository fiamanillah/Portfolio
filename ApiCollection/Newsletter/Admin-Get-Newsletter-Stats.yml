info:
  name: Admin - Get Newsletter Stats
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/newsletter/v1/stats"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
