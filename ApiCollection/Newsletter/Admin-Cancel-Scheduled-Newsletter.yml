info:
  name: Admin - Cancel Scheduled Newsletter
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/newsletter/v1/{{campaignId}}/cancel"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
