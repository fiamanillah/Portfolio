info:
  name: Admin - Get Newsletter By ID
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/newsletter/v1/{{campaignId}}"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
