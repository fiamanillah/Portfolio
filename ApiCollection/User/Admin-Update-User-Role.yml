info:
  name: Admin - Update User Role
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/users/v1/admin/users/TARGET_USER_ID/role"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "role": "MODERATOR",
        "badge": "Core Moderator"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
