info:
  name: Change Password
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/users/v1/change-password"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "currentPassword": "Password123!",
        "newPassword": "BrandNewSecurePassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
