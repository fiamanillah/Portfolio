info:
  name: Upload Profile Resume Document
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/users/v1/profile/resume"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: multipartForm
    data:
      - name: file
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
