info:
  name: Update Subscription
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/users/v1/subscription"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "subscribedToNewsletter": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
