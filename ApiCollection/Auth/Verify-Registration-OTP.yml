info:
  name: Verify Registration OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/v1/register/verify-otp"
  body:
    type: json
    data: |-
      {
        "email": "elena@example.com",
        "otpCode": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
