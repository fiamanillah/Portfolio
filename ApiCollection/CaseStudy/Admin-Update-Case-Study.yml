info:
  name: Admin - Update Case Study
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/case-studies/v1/admin/{{caseStudyId}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "title": "On Schedule - Inspection & Certification Management",
        "slug": "on-schedule",
        "subtitle": "Comprehensive SaaS for inspections, fleet tracking, and automated work orders",
        "description": "Architected and engineered an end-to-end B2B SaaS platform for managing physical asset inspections, employee safety certifications, and automated compliance reminders. The system streamlines compliance and maintenance tracking, unifying them under a tiered SaaS architecture.",
        "projectType": "CASE_STUDY",
        "status": "PUBLISHED",
        "projectStatus": "Production Ready",
        "order": 1,
        "featured": true,
        "pinned": true,
        "techStack": [
          "Bun",
          "Express.js",
          "TypeScript",
          "PostgreSQL",
          "Prisma ORM",
          "RabbitMQ",
          "Stripe",
          "Twilio",
          "AWS S3 & SES",
          "PDFKit"
        ],
        "liveUrl": "https://onschedule.ca",
        "githubUrl": "https://github.com/fiamanillah/onschedule-backend",
        "image": "CaptureX_2026-09-02_083744_onschedule.ca.jpg",
        "imageLabel": "On Schedule Dashboard Overview",
        "role": "Lead Architect & Full Stack Engineer",
        "timeline": "2026",
        "client": "On Schedule",
        "impact": "Eliminated missed compliance renewals and streamlined maintenance tracking with automated cross-channel reminders, unified under a scalable multi-tier SaaS architecture.",
        "highlights": [
          "High-performance REST API developed using the Bun runtime and Express.js",
          "Automated compliance scheduling with Twilio SMS and AWS SES email reminders",
          "Multi-tier SaaS subscription routing and automated billing powered by Stripe",
          "Dynamic PDF inspection report generation and export capabilities built with PDFKit",
          "Asynchronous job processing via RabbitMQ to ensure zero dropped notification events"
        ],
        "metadata": [
          { "label": "Architecture", "value": "Microservices + AMQP Queue", "icon": "Layers" },
          { "label": "Infrastructure", "value": "Docker + PostgreSQL", "icon": "Server" },
          { "label": "Domain", "value": "B2B SaaS / Compliance", "icon": "Briefcase" },
          { "label": "Deployment", "value": "AWS CloudFront & S3", "icon": "Cloud" }
        ],
        "contextBlocks": [
          { 
            "label": "The Challenge", 
            "body": "Managing physical asset inspections, fleet tracking, and employee safety certifications required a centralized, automated system. Previous industry methods relied on scattered spreadsheets and manual follow-ups, leading to costly delays, missed renewals, and compliance violations." 
          },
          { 
            "label": "The Solution", 
            "body": "Engineered a centralized B2B SaaS platform utilizing a robust Node.js/Bun backend. Integrated automated cron jobs and RabbitMQ queues to seamlessly dispatch Twilio SMS and AWS SES email reminders, alongside a feature-gated Stripe billing system." 
          },
          { 
            "label": "The Outcome", 
            "body": "Delivered a production-ready compliance engine that eliminated missed inspections. The system successfully gates features across multiple subscription tiers and provides offline-ready PDF reports for field audits and regulatory compliance." 
          }
        ],
        "architectureLayers": [
          {
            "name": "Frontend & UI Layer",
            "description": "Responsive dashboard and administration interfaces",
            "items": [
              { "title": "React & Tailwind CSS", "subtitle": "Dynamic client-side rendering" }
            ]
          },
          {
            "name": "Application Layer",
            "description": "High-performance API built on modern runtimes",
            "items": [
              { "title": "Bun & Express", "subtitle": "Fast TypeScript backend API" },
              { "title": "Prisma ORM", "subtitle": "Type-safe database interactions" }
            ]
          },
          {
            "name": "Background Processing Layer",
            "description": "Message broker and scheduling for automated alerts",
            "items": [
              { "title": "RabbitMQ", "subtitle": "AMQP Queue for asynchronous tasks" },
              { "title": "Node-Cron", "subtitle": "Scheduled inspection sweepers" }
            ]
          },
          {
            "name": "Data & Storage Layer",
            "description": "Relational data persistence and secure document storage",
            "items": [
              { "title": "PostgreSQL", "subtitle": "Primary relational database" },
              { "title": "AWS S3 & CloudFront", "subtitle": "Secure document & certificate storage" }
            ]
          }
        ],
        "features": [
          {
            "title": "Automated Email/SMS Reminders",
            "description": "Scheduled notification templates to alert clients and managers of upcoming or overdue inspections. Dispatched asynchronously via Twilio and AWS SES to prevent thread blocking.",
            "mediaType": "Image",
            "mediaLabel": "Reminders Dashboard",
            "media": "CaptureX_2026-09-02_083851_onschedule.ca.png",
            "tags": ["Automation", "Twilio", "AWS SES"]
          },
          {
            "title": "Fleet & Asset Tracking",
            "description": "Comprehensive tracking for fleet vehicles, physical assets, and tools, including VIN logging, employee assignments, location tracking, and real-time maintenance statuses.",
            "mediaType": "Image",
            "mediaLabel": "Fleet Tracking UI",
            "media": "CaptureX_2026-09-02_084859_onschedule.ca.png",
            "tags": ["Fleet", "Asset Management"]
          },
          {
            "title": "Employee Certification Management",
            "description": "Dedicated dashboard for monitoring employee safety certifications, ensuring that valid, expiring, or expired documents are tracked proactively with automated alerts.",
            "mediaType": "Image",
            "mediaLabel": "Employee Certifications",
            "media": "CaptureX_2026-09-02_085012_onschedule.ca.png",
            "tags": ["Compliance", "HR", "Certifications"]
          },
          {
            "title": "Tiered SaaS Billing",
            "description": "Seamlessly integrated Stripe payment processing managing Basic, Pro, and Enterprise subscription tiers. Includes automated renewal tracking and feature-level access gating.",
            "mediaType": "Image",
            "mediaLabel": "Transaction History",
            "media": "CaptureX_2026-09-02_084503_onschedule.ca.png",
            "tags": ["Stripe", "SaaS Billing", "Webhooks"]
          },
          {
            "title": "PDF Inspection Reports",
            "description": "Dynamic programmatic generation and export of scheduled, completed, and overdue inspection reports for offline sharing, management review, and compliance audits.",
            "mediaType": "Image",
            "mediaLabel": "Report Generation",
            "media": "CaptureX_2026-09-02_085048_onschedule.ca.png",
            "tags": ["PDFKit", "Reporting", "Export"]
          }
        ],
        "metrics": [
          { "value": "3", "label": "Subscription Tiers Managed" },
          { "value": "100%", "label": "Automated Compliance Alerts" },
          { "value": "Zero", "label": "Dropped Notification Events" },
          { "value": "< 50ms", "label": "Average API Response Time" }
        ],
        "postMortem": [
          {
            "title": "Asynchronous Notifications",
            "body": "Integrating RabbitMQ with Twilio and AWS SES enabled reliable, asynchronous delivery of critical compliance reminders without blocking core API threads.",
            "entries": [
              { "heading": "Message Queuing", "detail": "Decoupled the notification engine using RabbitMQ to ensure timely dispatch of SMS and email alerts, even during traffic spikes or third-party API rate limits." }
            ]
          },
          {
            "title": "Stripe Webhook Synchronization",
            "body": "Implementing Stripe webhooks for subscription lifecycles required careful architectural planning to handle transient network errors.",
            "entries": [
              { "heading": "Idempotent Event Processing", "detail": "Built idempotent webhook handlers to guarantee that subscription upgrades, downgrades, and cancellations were processed exactly once, preventing duplicate billing states." }
            ]
          },
          {
            "title": "Scalable PDF Generation",
            "body": "Generating comprehensive compliance reports on the fly required optimizing server memory allocation.",
            "entries": [
              { "heading": "Background PDF Tasks", "detail": "Offloading PDFKit report generation to asynchronous background workers prevented the main thread from blocking during large multi-page compliance exports." }
            ]
          }
        ],
        "seo": {
          "metaTitle": "On Schedule SaaS Architecture Case Study",
          "metaDescription": "In-depth case study of On Schedule, a B2B SaaS platform for asset inspections, fleet tracking, and automated compliance reminders built with Bun, Express, Prisma, PostgreSQL, and Stripe.",
          "metaKeywords": ["saas", "inspections", "bun", "postgresql", "stripe", "twilio", "rabbitmq", "aws-ses"]
        }
      }
  auth: inherit

runtime:
  variables:
    - name: caseStudyId
      value: de516571-664b-45b9-8920-d58c84bb423c

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
