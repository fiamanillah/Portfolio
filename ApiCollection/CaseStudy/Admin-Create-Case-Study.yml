        "title": "MojaCares - Intelligent EHR & Clinical Insights Platform",
        "slug": "mojacares",
        "subtitle": "Full-stack healthcare management system with automated medical data extraction and real-time vitals tracking",
        "description": "Architected and engineered a comprehensive, full-stack Electronic Health Record (EHR) platform designed to unify patient histories and automate clinical workflows. The system features a responsive frontend clinical dashboard seamlessly integrated with a robust Node.js backend, providing intelligent health insights through automated extraction of unstructured medical documents and longitudinal tracking of patient vitals.",
