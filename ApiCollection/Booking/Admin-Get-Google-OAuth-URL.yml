info:
  name: Admin - Get Google Calendar OAuth URL
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/booking/v1/admin/google/auth"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
